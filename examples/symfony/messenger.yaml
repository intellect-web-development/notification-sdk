# Фрагмент Resource/config/services/messenger.yaml продукта.
# Публикация команд в Notification; очередь объявляет сервис-получатель (queues: false).
# Notification событий наружу не публикует, поэтому транспорта для входящих сообщений нет.

framework:
    messenger:
        transports:
            notification-commands-transport:
                dsn: '%env(PLATFORM_MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                options:
                    exchange:
                        name: notification.commands
                        type: direct
                    queues: false
        routing: { }
